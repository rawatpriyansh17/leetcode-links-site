<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A focused roadmap for mastering data structures and algorithms with curated LeetCode problems." />
    <meta name="theme-color" content="#f6f7f2" />
    <title>DSA Roadmap — LeetCode Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Leetcode Links home">
        <span class="brand-mark">&lt;/&gt;</span>
        <span>Leetcode Links</span>
      </a>
      <div class="header-actions">
        <button class="icon-button" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <a class="github-link" href="https://github.com/" target="_blank" rel="noreferrer" aria-label="Open GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.36-3.9-1.36-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.98 10.98 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        </a>
      </div>
    </header>

    <main id="top">
      <section class="progress-summary" aria-label="Progress summary">
        <div class="progress-card" aria-label="Overall progress">
          <div class="progress-copy">
            <div>
              <span class="progress-label">OVERALL PROGRESS</span>
              <strong id="progressText">0 of 0 completed</strong>
            </div>
            <span class="progress-percent" id="progressPercent">0%</span>
          </div>
          <div class="progress-track"><span id="progressBar"></span></div>
          <p id="progressMessage">Start small. Consistency compounds.</p>
        </div>
      </section>

      <section class="workspace" aria-label="Problem roadmap">
        <aside class="sidebar">
          <div class="sidebar-heading">TOPICS <span id="topicCount"></span></div>
          <nav id="topicNav" aria-label="Topics"></nav>
        </aside>

        <div class="content">
          <div class="toolbar">
            <label class="search-box" for="searchInput">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              <input id="searchInput" type="search" placeholder="Search problems or topics..." autocomplete="off" />
              <kbd>/</kbd>
            </label>
            <div class="filters" role="group" aria-label="Filter by status">
              <button class="filter active" type="button" data-filter="all">All</button>
              <button class="filter" type="button" data-filter="todo">To do</button>
              <button class="filter" type="button" data-filter="done">Done</button>
            </div>
          </div>

          <div class="results-meta">
            <span id="resultsText">All problems</span>
            <button id="resetButton" class="reset-button" type="button">Reset progress</button>
          </div>
          <div id="problemList"></div>
          <div class="empty-state" id="emptyState" hidden>
            <span>∅</span>
            <h2>No problems found</h2>
            <p>Try another search or status filter.</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>One problem at a time. <span>Keep going →</span></p>
      <a href="#top">Back to top ↑</a>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
